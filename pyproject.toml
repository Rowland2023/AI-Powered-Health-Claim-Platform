
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-health-claim-platform"
version = "0.1.0"
description = "Healthcare claims platform with DDD"
requires-python = ">=3.11"
dependencies = [
    "django>=4.2",
    "djangorestframework>=3.14",
    "fastapi>=0.104",
    "sqlalchemy>=2.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "psycopg2-binary>=2.9",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-django>=4.5",
    "ruff>=0.1",
    "httpx>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "apps",
    "apps.*",
    "Healthcare_Claim_Processing",
    "Healthcare_Claim_Processing.*",
]
exclude = [
    "AI-Powered-Health-Claim-Platform",
    "AI-Powered-Health-Claim-Platform.*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "Healthcare_Claim_Processing.settings"
pythonpath = ["Healthcare_Claim_Processing", "."]
testpaths = [
    "Healthcare_Claim_Processing/apps",
    "Healthcare_Claim_Processing",
]

[tool.ruff]
line-length = 100
target-version = "py311"
