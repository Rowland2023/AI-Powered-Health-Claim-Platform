name: CI

on: [push, pull_request]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: healthclaims_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d healthclaims_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      DJANGO_SECRET_KEY: test-secret-key-32-chars-long-for-ci-only
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/healthclaims_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check formatting and lint
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=apps --cov-report=term --cov-fail-under=40
